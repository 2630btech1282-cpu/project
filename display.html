<html>
    <head>
        <style>
            .block {
                display: block;
                width: 400px;
                background-color: lightblue;
                margin: 10px;
            }
            .inline{
                display: inline;
                background-color: blue;
            }
            .inline-block{
                display: inline-block;
                width: 200px;
                background-color: lightyellow;
                margin: 5px;
            }
            .none{
                display: none;
            }
        </style>
     </head>
        <body>
            <h2> 1. Block </h2>
            <div class="block"> Box 1</div>
            <div class="block"> Box 2</div>
            <div class="block"> Box 3</div>
            <h2> 2. Inline </h2>
            <div class="inline"> Box 1 </div>
            <div class="inline"> Box 2</div>
            <div class="inline"> Box 3</div>
            <h3> 3.Inline-block </h3>
            <div class="inline-block"> Box 1</div>
            <div class="inline-block"> Box 2</div>
            <div class="inline-block"> Box 3</div>

        </body>

    
</html>
