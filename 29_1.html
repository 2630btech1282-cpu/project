<html>
    <head>
        <style>
            .card{
                width: 300px; /* width of card */
                padding: 20px; /* space inside card */
                background-color: white; /* background colour */
                border: 2px solid gray; /* border around the card */
                border-radius: 10px; /* rounded corners */

            }
            /* Card heading 
            card h2 means select the <h2> inside the .card*/
            .card h2{
                color: blue; /* heading colour */
                text-align: center; /* center the heading */

            }
            .card p{
                color: gray;
                font-size: 16px;
            }
        </style>
    </head>
    <body>
        <!-- to group elements we use div-->
        <div class="card">
        <h2> Web Development</h2>
        <p> Learn HTML and CSS to create beautiful webpages.</p>
        </div>
    </div>
    </body>
</html>
